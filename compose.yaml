name: poverty-bank-a2-optimized

x-app: &app
  image: poverty-bank-a2-optimized:local
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace
  environment: &app-env
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    TZ: UTC
    DATA_PROFILE: showcase

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: poverty_bank
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      TZ: UTC
    ports:
      - "127.0.0.1:${A2_PG_PORT:-15434}:5432"
    volumes:
      - showcase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d poverty_bank"]
      interval: 2s
      timeout: 3s
      retries: 30

  python:
    <<: *app
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "run_sql.py"]

  setup:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/initialize_reporting.py"]
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *app-env
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: poverty_bank
      PGUSER: report_reader
      PGPASSWORD: local_demo_reader
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    ports:
      - "127.0.0.1:${A2_WEB_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: ["python", "web/server.py"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  showcase-data:
